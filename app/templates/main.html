<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 화면</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body>
    <header class="main-header">
        <h1 class="header-title">간단 코드 리뷰</h1>
        <div class="user-info">
            <span class="user-nickname">{{ user.nickname }}</span>
            <a href="/api/auth/logout" class="btn">로그아웃</a>
        </div>
    </header>

    <main class="main-content">
        <h2 class="section-title">그룹 목록</h2>
        <div class="group-box-list">
            {% for group in groups %}
            <a class="group-box" href="/groupedit?id={{ group._id }}">
                <span class="group-box-name">{{ group.name }}</span>
                <span class="group-box-setting"></span>
            </a>
            {% else %}
            <p class="empty-text">아직 그룹이 없습니다.</p>
            {% endfor %}
        </div>

        <div class="main-actions">
            <a href="/groupcreate" class="btn">그룹 생성</a>
            <a href="/questionupload" class="btn">코드올리기</a>
        </div>

        <h2 class="section-title">질문 목록</h2>
        <div class="code-list">
            {% for item in items %}
            <div class="code-item">
                <span class="code-name">{{ item.title }}</span>
                <span class="code-meta">
                    <span class="code-owner">{{ item.owner }}</span>
                    <span class="code-date">{{ item.at_create }}</span>
                </span>
            </div>
            {% else %}
            <p class="empty-text">아직 질문이 없습니다.</p>
            {% endfor %}
        </div>
    </main>
</body>

</html>
