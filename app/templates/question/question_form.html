<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코드 업로드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/monokai.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body>
<header class="main-header">
    <h1 class="header-title">PeerSolve</h1>
    <div class="user-info">
        {#<span class="user-nickname">{{ user.nickname }}</span>#}
        <a href="/api/auth/logout" class="btn">로그아웃</a>
    </div>
</header>
<main class="main-content">
    <form>
        <div class="mb-3">
            <input type="text" class="form-control" name="title" id="title"
                   value="{{ question.title if question else '' }}"
                   placeholder="제목을 입력하세요"/>
        </div>
        <select id="language" name="language">
            {#TODO: 하드코딩된 옵션 바꾸기#}
            <option value="python" {% if question and question.language == "python" %}selected{% endif %}>Python
            </option>
            <option value="c" {% if question and question.language == "c" %}selected{% endif %}>C</option>
            <option value="javascript" {% if question and question.language == "javascript" %}selected{% endif %}>
                JavaScript
            </option>
        </select>
        <div class="mb-3">
            <textarea class="form-control" id="code">{{ question.code if question else '' }}</textarea>
        </div>
    </form>

    <a id="cancel" class="btn btn-secondary" href="#" onclick="history.back()">취소</a>
    <a id="upload" class="btn btn-primary" href="#" onclick="saveQuestion()">{{ "수정" if mode == "edit" else "등록" }}</a>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/javascript/javascript.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script>
    const modes = {
        c: "text/x-csrc",
        python: "python",
        javascript: "javascript"
    };

    const language = $("#language").val();

    const editor = CodeMirror.fromTextArea(
        document.getElementById("code"),
        {
            mode: modes[language] || "text/plain",
            theme: "monokai",
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            lineWrapping: false
        }
    );

    $("#language").on("change", function () {
        const language = $(this).val();

        editor.setOption(
            "mode",
            modes[language] || "text/plain"
        );
    });

    const mode = "{{ mode }}";
    const questionId = "{{ question._id if question else '' }}";

    function saveQuestion() {
        const isEdit = mode === "edit";

        $.ajax({
            type: isEdit ? "PUT" : "POST",
            url: isEdit
                ? `/api/question/${questionId}`
                : "/api/question",
            data: {
                title: $('#title').val(),
                language: $('#language').val(),
                code: editor.getValue()
            },
            success: function (response) {
                alert(isEdit
                    ? "코드를 성공적으로 수정했습니다!"
                    : "코드를 성공적으로 업로드했습니다!");
                history.back();
            },
            error: function (xhr) {
                alert(xhr.responseJSON?.message || "요청에 실패했습니다.");
            }
        });
    }
</script>
</body>

</html>
