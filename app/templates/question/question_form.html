<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코드 업로드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
<form>
    <div class="mb-3">
        <input type="text" class="form-control" name="title" id="title" value="{{ question.title if question else '' }}"
               placeholder="제목을 입력하세요"/>
    </div>
    <select id="language" name="language">
        {#TODO: 하드코딩된 옵션 바꾸기#}
        <option value="python" {% if question and question.language == "python" %}selected{% endif %}>Python</option>
        <option value="c" {% if question and question.language == "c" %}selected{% endif %}>C</option>
        <option value="javascript" {% if question and question.language == "javascript" %}selected{% endif %}>
            JavaScript
        </option>
    </select>
    <!-- TODO: 코드 에디터 적용 -->
    <div class="mb-3">
        <textarea class="form-control" name="code" id="code" rows="3"
                  placeholder="코드를 입력하세요">{{ question.code if question else '' }}</textarea>
    </div>
</form>

<a id="cancel" class="btn btn-secondary" href="#" onclick="history.back()">취소</a>
<a id="upload" class="btn btn-primary" href="#" onclick="saveQuestion()">{{ "수정" if mode == "edit" else "등록" }}</a>

<script>
    const mode = "{{ mode }}";
    const questionId = "{{ question._id if question else '' }}";

    function saveQuestion() {
        const isEdit = mode === "edit";

        $.ajax({
            type: isEdit ? "PATCH" : "POST",
            url: isEdit
                ? `/api/question/${questionId}`
                : "/api/question",
            data: {
                title: $('#title').val(),
                language: $('#language').val(),
                code: $('#code').val()
            },
            success: function (response) {
                alert(isEdit
                    ? "코드를 성공적으로 수정했습니다!"
                    : "코드를 성공적으로 업로드했습니다!");
                history.back();
            },
            error: function (xhr) {
                alert(xhr.responseJSON?.message || "요청에 실패했습니다.");
            }
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</body>

</html>
