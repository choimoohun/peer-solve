<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코드 업로드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <form>
        <div class="mb-3">
            <input type="text" class="form-control" name="title" id="title" placeholder="제목을 입력하세요" />
        </div>
        <select id="language" name="language">
            <option value="python">python</option>
            <option value="cpp">C++</option>
            <option value="javascript">JavaScript</option>
        </select>
        <!-- TODO: 코드 에디터 적용 -->
        <div class="mb-3">
            <textarea class="form-control" name="code" id="code" rows="3" placeholder="코드를 입력하세요"></textarea>
        </div>
    </form>

    <a id="cancel" class="btn btn-secondary" href="#" onclick="history.back()">취소</a>
    <a id="upload" class="btn btn-primary" href="#" onclick="upload()">등록</a>

    <script>
        function upload() {
            const title = $('#title').val();
            const language = $('#language').val();
            const code = $('#code').val();

            $.ajax({
                type: "POST",
                url: "/api/question/",
                data: {
                    title: title,
                    language: language,
                    code: code
                },
                success: function (response) {
                    history.back();
                },
                error: function (xhr) {
                    console.error('');
                }
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</body>

</html>
