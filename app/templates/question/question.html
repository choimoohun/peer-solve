<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body data-question-id="{{ question._id }}">
<div class="mb-3">
    {{ question.title }}
    {{ question.at_update }}
</div>
<div class="mb-3">
    <p>작성자 {{ owner.nickname }}</p>
    {% if is_owner %}
        <a href="/question/{{ question._id }}/edit" class="btn btn-primary">수정</a>
        <button onclick="ask_delete()" type="button" class="btn btn-danger">삭제</button>
    {% endif %}
</div>

<div class="mb-3">
    {{ question.language }}
    <br>
    {{ question.code }}
</div>

<div class="mb-3">
    <p id="total">댓글 0개</p>
    <div class="form-floating">
    <textarea class="form-control" id="text"
              style="height: 100px"></textarea>
        <button type="button" class="btn btn-primary" onclick="add_comment()">작성</button>
    </div>
    <div id="comment-list" class="mt-3"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="/static/js/question.js"></script>
</body>
</html>
