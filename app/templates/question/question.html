<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ question.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/code.css') }}">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body data-question-id="{{ question._id }}">
<header class="main-header">
    <h1 class="header-title"><a href="/main">PeerSolve</a></h1>
    <div class="user-info">
        <span class="user-nickname">{{ user.nickname }}</span>
        <a href="/api/auth/logout" class="btn">로그아웃</a>
    </div>
</header>
<main class="main-content">
    <div class="mb-3">
        <span class="section-title">{{ question.title }}</span>
        <span>{{ question.at_update.strftime("%Y-%m-%d") }}</span>
    </div>
    <div class="mb-3">
        <p>작성자 {{ owner.nickname }}</p>
        {% if is_owner %}
            <a href="/question/{{ question._id }}/edit" class="btn btn-primary">수정</a>
            <button onclick="ask_delete()" type="button" class="btn btn-danger">삭제</button>
        {% endif %}
    </div>

    <div class="mb-3">
        <div class="code-box">
            <div class="code-header">
                {{ question.language }}
            </div>
            <div class="code-scroll">
                {{ code | safe }}
            </div>
        </div>
    </div>

    <div class="mb-3">
        <p id="total">댓글 0개</p>
        <div class="form-floating mb-3">
    <textarea class="form-control" id="text"
              style="height: 100px"></textarea>
        </div>
        <button type="button" class="btn btn-primary" onclick="add_comment()">작성</button>
    </div>
    <div id="comment-list" class="mt-3"></div>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="/static/js/question.js"></script>
</body>
</html>
