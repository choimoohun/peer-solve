<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body>
    <header class="main-header">
        <h1 class="header-title"><a href="/main">PeerSolve</a></h1>
    </header>

    <main class="main-content auth-content">
        <h2 class="section-title">로그인</h2>

        {% if request.args.get('error') %}
        <p class="auth-error">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        {% endif %}

        <form action="/api/auth/login" method="POST" class="auth-form">
            <div class="input-group">
                <input type="text" id="userId" name="userId" placeholder="아이디를 입력하세요" required autocomplete="username">
            </div>

            <div class="input-group">
                <input type="password" id="userPassword" name="userPassword" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">로그인</button>
            </div>
        </form>

        <a href="/signup" class="auth-link">회원가입하기</a>
    </main>
</body>

</html>
